<!-- makes an enquiry and enters contact details-->
<main>
<section class="enquiry form">
<h1>Make an enquiry</h1>
<p> Have questions about catering, venue, or made to order </p>

<form action="#" method="post" id="enquiry-form"  novalidate>
<label for="name">Full Name</label>
<input type="text" id="name" name="name" required>
<span id="name-error" class="error-message" aria-live="polite"></span>


<label for="email">Email Address</label>
<input type="email" id="email" name="email" required>
<span id="email-error" class="error-message" aria-live="polite"></span>

<label for="phone">Phone Number</label>
<input type="tel" id="phone" name="phone" required>
<span id="phone-error" class="error-message" aria-live="polite"></span>


<label for="enquiry-type">Type of Enquiry</label>
<select id="enquiry-type" name="enquiry-type">
    <option value="catering">Catering</option>
     <option value="Venue">Venue</option>
      <option value="made to order">Made to Order</option>
</select>
<span id="enquiry-type-error" class="error-message" aria-live="polite"></span>

<label for="message">Message</label>
<textarea id="message" name="message" rows="5" required></textarea>
<span id="message-error" class="error-message" aria-live="polite"></span>




<button type="submit">Send Enquiry</button>
</form>
<div id="enquiry-response" class="enquiry-response" aria-live="polite"></div>
</section>
</main>
